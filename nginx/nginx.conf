worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # --- /api/ingress/ -> data_ingress (audiomind-app:8000) ---
        location /api/ingress/ {
            rewrite ^/api/ingress(/.*)$ $1 break;
            proxy_pass http://audiomind-app:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 500M;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;
        }

        # --- /api/analysis/ -> llm_analysis (audiomind-llm-analysis:8003) ---
        location /api/analysis/ {
            rewrite ^/api/analysis(/.*)$ $1 break;
            proxy_pass http://audiomind-llm-analysis:8003;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # --- / -> frontend (audiomind-frontend:5173, Vite dev server) ---
        location / {
            proxy_pass http://audiomind-frontend:5173;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
