services:
  postgres:
    image: postgres:17
    container_name: audiomind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: audiomind-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "${S3_PORT}:9000"
      - "9002:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: audiomind-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"

  app:
    build:
      context: .
      dockerfile: data_ingress/Dockerfile
    container_name: audiomind-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: audiomind-postgres
      DB_PORT: 5432
      S3_ENDPOINT: http://audiomind-minio:9000
      RABBITMQ_HOST: audiomind-rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      rabbitmq:
        condition: service_started

  mongodb:
    image: mongo:7
    container_name: audiomind-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  transcription:
    build:
      context: .
      dockerfile: transcription_service/Dockerfile
    container_name: audiomind-transcription
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: audiomind-rabbitmq
      S3_ENDPOINT: http://audiomind-minio:9000
      MONGO_HOST: audiomind-mongodb
      DATA_INGRESS_URL: http://audiomind-app:8000
    depends_on:
      - rabbitmq
      - minio
      - mongodb
      - app

  dialogue_detection:
    build:
      context: .
      dockerfile: dialogue_detection/Dockerfile
    container_name: audiomind-dialogue-detection
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: audiomind-rabbitmq
      S3_ENDPOINT: http://audiomind-minio:9000
      MONGO_HOST: audiomind-mongodb
      DATA_INGRESS_URL: http://audiomind-app:8000
    depends_on:
      - rabbitmq
      - minio
      - mongodb
      - app

  llm_analysis:
    build: ./llm_analysis_service
    container_name: audiomind-llm-analysis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_HOST: audiomind-mongodb
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: audiomind-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app
      - llm_analysis

  nginx:
    image: nginx:alpine
    container_name: audiomind-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - llm_analysis
      - frontend

volumes:
  postgres_data:
  minio_data:
  mongo_data:
